<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>ReçeteLab Ziyaretçi İstatistikleri</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;background:#07111f;color:#eef5ff;display:grid;place-items:center;padding:24px}.wrap{width:min(900px,100%)}h1{font-size:clamp(28px,5vw,48px);margin:0 0 8px}.sub{color:#9fb0c7;margin:0 0 28px}.login,.card{background:#0d1a2b;border:1px solid #20344f;border-radius:18px;padding:22px;box-shadow:0 18px 50px #0005}.login{display:flex;gap:10px;margin-bottom:20px}input,button{border-radius:10px;border:1px solid #2c4668;padding:13px 14px;font:inherit}input{flex:1;background:#081422;color:#fff}button{background:#ff8123;color:#111;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.label{color:#9fb0c7;font-size:14px}.value{font-size:clamp(34px,7vw,64px);font-weight:850;margin-top:8px}.date{margin-top:18px;color:#9fb0c7}.error{color:#ff9e9e;margin-top:12px}.back{display:inline-block;margin-top:18px;color:#bcd6ff;text-decoration:none}@media(max-width:600px){.grid{grid-template-columns:1fr}.login{flex-direction:column}}
</style></head>
<body><main class="wrap"><h1>Ziyaretçi İstatistikleri</h1><p class="sub">Bu ekran yalnızca yönetici anahtarıyla açılır.</p>
<div class="login"><input id="key" type="password" placeholder="Yönetici anahtarı"><button id="load">Göster</button></div>
<section class="grid" hidden id="stats">
<div class="card"><div class="label">Toplam tekil ziyaretçi</div><div class="value" id="totalUnique">0</div></div>
<div class="card"><div class="label">Toplam ziyaret</div><div class="value" id="totalVisits">0</div></div>
<div class="card"><div class="label">Bugünkü tekil ziyaretçi</div><div class="value" id="todayUnique">0</div></div>
<div class="card"><div class="label">Bugünkü ziyaret</div><div class="value" id="todayVisits">0</div></div>
</section><div class="date" id="date"></div><div class="error" id="error"></div><a class="back" href="/admin/">← İçerik yönetimine dön</a>
<script>
const fmt=n=>new Intl.NumberFormat('tr-TR').format(n);const keyInput=document.getElementById('key');keyInput.value=sessionStorage.getItem('stats_admin_key')||'';
async function load(){const key=keyInput.value.trim(),err=document.getElementById('error');err.textContent='';if(!key){err.textContent='Yönetici anahtarını yazmalısın.';return}try{const r=await fetch('/api/stats?key='+encodeURIComponent(key),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'İstatistikler alınamadı.');sessionStorage.setItem('stats_admin_key',key);['totalUnique','totalVisits','todayUnique','todayVisits'].forEach(id=>document.getElementById(id).textContent=fmt(d[id]));document.getElementById('date').textContent='Tarih: '+d.date+' · Türkiye saati';document.getElementById('stats').hidden=false}catch(e){err.textContent=e.message;document.getElementById('stats').hidden=true}}
document.getElementById('load').onclick=load;keyInput.addEventListener('keydown',e=>{if(e.key==='Enter')load()});if(keyInput.value)load();
</script></main></body></html>
