backend:
  name: git-gateway
  branch: main
media_folder: 'assets/uploads'
public_folder: '/assets/uploads'
collections:
  - name: 'site'
    label: 'Site Content'
    files:
      - label: 'Multilingual Content'
        name: 'multilingual'
        file: 'content/site.json'
        fields:
          - {label: 'Site JSON', name: 'body', widget: 'code', default_language: 'json', output_code_only: true}
